<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>G41 心算對決</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A1F2E">
<style>
:root{
  --ink:#0A1F2E; --ink-2:#123244; --line:#1F5169;
  --paper:#E9F7FF; --dim:#7FB3C9; --wire:#4DD4FF; --spark:#FFD84D;
  --good:#6BE8A8; --bad:#FF6B6B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-weight:inherit;border:none;cursor:pointer;color:inherit}
body{min-height:100vh;background:var(--ink);color:var(--paper);
  font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;font-weight:700;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));}

#exitGame{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:60;height:28px;padding:0 12px;border-radius:99px;background:rgba(0,0,0,.5);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:inline-flex;align-items:center;
  gap:4px;font-size:12px;font-weight:700;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.25)}

.screen{display:none;flex-direction:column;align-items:center;gap:14px;max-width:420px;margin:0 auto;padding-top:26px}
.screen.on{display:flex}
h1{font-size:26px;text-align:center;line-height:1.3}
h1 b{color:var(--wire)}
.hero{font-size:46px;text-align:center;line-height:1}
.sub{font-size:14px;color:var(--dim);font-weight:500;text-align:center;line-height:1.75}
.sub b{color:var(--paper)}
.who{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.who span{background:var(--ink-2);border-radius:99px;padding:7px 13px;font-size:13px}
.card{width:100%;background:var(--ink-2);border:2px solid var(--line);border-radius:18px;padding:15px}
.lenRow{display:flex;gap:9px;width:100%}
.lenRow button{flex:1;background:var(--ink-2);border:2px solid var(--line);border-radius:15px;padding:13px 0;font-size:15px;color:var(--dim)}
.lenRow button.on{border-color:var(--wire);color:var(--wire);background:#1A4258}
.lenRow button:active{transform:scale(.96)}
.go{width:100%;background:var(--wire);color:#031722;border-radius:18px;padding:17px 0;font-size:18px}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.4}
.back{color:var(--dim);font-size:13px;font-weight:500;text-decoration:underline;text-align:center}
.tip{font-size:12px;color:var(--dim);font-weight:500;text-align:center;line-height:1.7}

.passName{font-size:30px;text-align:center;line-height:1.3}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);font-style:normal}
.dots i.done{background:var(--wire)}
.dots i.now{background:var(--spark);transform:scale(1.35)}

.probBox{width:100%;background:linear-gradient(135deg,#1A4258,#123244);
         border:2px solid var(--line);border-radius:20px;padding:24px 15px;text-align:center}
.probTxt{font-size:40px;letter-spacing:.03em}
.probTime{font-size:15px;color:var(--dim);font-weight:500;margin-top:8px}

.answerShow{width:100%;background:var(--ink-2);border:2px solid var(--wire);border-radius:16px;
            padding:14px;text-align:center;font-size:34px;color:var(--wire);letter-spacing:.05em;min-height:52px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.pad button{background:var(--ink-2);border:2px solid var(--line);border-radius:14px;padding:14px 0;font-size:22px}
.pad button:active{transform:scale(.94);border-color:var(--wire)}
.pad button.wide{grid-column:span 1;font-size:16px;color:var(--dim)}
.pad button.ok{background:var(--wire);color:#031722;font-size:18px}

.revRow{width:100%;background:var(--ink-2);border:2px solid var(--line);border-radius:15px;
        padding:12px 14px;display:flex;align-items:center;gap:11px}
.revRow.win{border-color:var(--spark);background:#3A2E10}
.revRow.hit{border-color:var(--good);background:#123A2C}
.revRow.miss{border-color:var(--bad);background:#3A1616}
.revRow .rk{font-size:18px;flex:none;width:26px;text-align:center}
.revRow .nm{flex:1;font-size:14px;line-height:1.4}
.revRow .tm{font-size:14px;color:var(--dim)}

.board{width:100%;display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:11px;background:var(--ink-2);border-radius:15px;padding:13px 15px}
.row.top{background:var(--wire);color:#031722}
.row .rk{font-size:19px;width:30px;text-align:center;flex:none}
.row .nm{flex:1;font-size:16px}
.row .sc{font-size:16px}
</style>
</head>
<body>

<a href="index.html#lobby" id="exitGame" aria-label="返回遊戲間">← 離開</a>

<section id="intro" class="screen on">
  <div class="hero">🧮⚡</div>
  <h1>G41 <b>心算對決</b></h1>
  <p class="sub">
    輪流看同一題算式，<b>心算出答案</b>再輸入——<br>
    系統自動判對錯，<b style="color:var(--wire)">又快又對</b>分數最高！<br>
    <span style="color:var(--bad)">算錯不扣分，但輸給比你快的人</span><br>
    <span style="color:var(--spark)">題目會越來越難，看誰撐到最後</span>
  </p>
  <div class="who" id="whoRow"></div>
  <div class="card">
    <p class="sub" style="margin-bottom:10px">玩幾題？</p>
    <div class="lenRow">
      <button data-len="6">6 題<br><span style="font-size:11px;color:var(--dim)">快速</span></button>
      <button data-len="10" class="on">10 題<br><span style="font-size:11px;color:var(--dim)">標準</span></button>
      <button data-len="15">15 題<br><span style="font-size:11px;color:var(--dim)">長期戰</span></button>
    </div>
  </div>
  <button class="go" id="startBtn">🧮 開始心算</button>
  <p class="tip">📱 一台裝置輪流傳著算<br>算的時候別讓別人看到你的過程！</p>
  <a class="back" href="index.html#lobby">← 回遊戲間（改玩家設定）</a>
</section>

<section id="pass" class="screen">
  <div class="hero">🧮</div>
  <div class="passName" id="passName">換 🧒 George</div>
  <p class="tip">把裝置交給他，<b>其他人先別看</b> 🙈</p>
  <div class="dots" id="passDots"></div>
  <button class="go" id="passBtn">好，我拿到了</button>
</section>

<section id="calc" class="screen">
  <div class="probBox">
    <div class="probTxt" id="probTxt">7 + 5</div>
    <div class="probTime">解出來就馬上按確定，越快越好</div>
  </div>
  <div class="answerShow" id="answerShow">&nbsp;</div>
  <div class="pad" id="pad"></div>
</section>

<section id="reveal" class="screen">
  <h1 id="revTitle">第 3 / 10 題</h1>
  <div class="probBox" style="padding:14px"><div class="probTxt" id="revProb" style="font-size:26px"></div></div>
  <div style="width:100%;display:flex;flex-direction:column;gap:9px" id="revBoard"></div>
  <button class="go" id="nextBtn">下一題 →</button>
</section>

<section id="over" class="screen">
  <div class="hero">🏆</div>
  <h1 id="overTitle"></h1>
  <div class="board" id="board"></div>
  <button class="go" id="again">🔁 再算一輪</button>
  <a class="back" href="index.html#lobby" id="gohome">🏠 回遊戲間（換一款玩）</a>
</section>

<script src="family-players.js?v=5"></script>
<script>
/* ============================================================
   G41 心算對決
   跟 G17（搶答，靠人判定）不同：這款是系統自動出題、自動判對錯、
   私密計時（不公開誰在算），比的是「又快又準」而不是「敢不敢先喊」。
   耐玩來源＝題目難度隨題數遞增，逼大家逐漸逼近自己的心算極限。
   ============================================================ */

const CONFIG = { MAX_ANSWER_LEN: 4 };

function genProblem(round, totalRound) {
  const stage = round / totalRound;
  let a, b, op, ans;
  if (stage < 0.34) {
    op = Math.random() < 0.5 ? '+' : '−';
    a = 2 + Math.floor(Math.random()*28);
    b = 2 + Math.floor(Math.random()*28);
    if (op === '−' && b > a) [a,b] = [b,a];
    ans = op === '+' ? a+b : a-b;
  } else if (stage < 0.7) {
    const choice = Math.random();
    if (choice < 0.5) {
      op='×'; a=2+Math.floor(Math.random()*11); b=2+Math.floor(Math.random()*11); ans=a*b;
    } else {
      op='+/−'; op = Math.random()<0.5?'+':'−';
      a=10+Math.floor(Math.random()*70); b=10+Math.floor(Math.random()*70);
      if(op==='−' && b>a)[a,b]=[b,a];
      ans = op==='+'?a+b:a-b;
    }
  } else {
    const choice = Math.random();
    if (choice<0.5){ op='×'; a=3+Math.floor(Math.random()*10); b=3+Math.floor(Math.random()*10); ans=a*b; }
    else { op='÷'; b=2+Math.floor(Math.random()*9); ans=2+Math.floor(Math.random()*11); a=ans*b; }
  }
  return { text: `${a} ${op} ${b}`, ans };
}

let AC=null;
function beep(fs,dur,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();
 fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
 const t0=AC.currentTime+i*0.06;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||0.12,t0+0.01);
 g.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.14));o.connect(g);g.connect(AC.destination);
 o.start(t0);o.stop(t0+(dur||0.14)+0.02);});}catch(e){}}
const SFX={
  tap:()=>beep([560],0.06,'triangle',0.09),
  key:()=>beep([700],0.04,'square',0.06),
  win:()=>beep([784,988,1319],0.13,'triangle',0.14),
  hit:()=>beep([659,880],0.1,'triangle',0.12),
  miss:()=>beep([220,165],0.18,'sawtooth',0.11),
  champ:()=>beep([659,880,1175,1568],0.16,'triangle',0.16),
};
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);};

const S = { players:[], total:10, round:0, prob:null, turn:0, results:[], scores:[], curInput:'', startAt:0 };

function boot(){
  S.players = FP.get();
  $('whoRow').innerHTML = S.players.map(p=>`<span>${p.emoji} ${p.name}</span>`).join('');
  if(S.players.length<2){ $('startBtn').textContent='⚠️ 至少要 2 個人才能對決'; $('startBtn').disabled=true; }
  $('pad').innerHTML = ['1','2','3','4','5','6','7','8','9','−','0','⌫'].map(k=>
    `<button data-k="${k}" class="${k==='⌫'?'wide':''}">${k}</button>`).join('')
    + `<button class="ok" id="okBtn" style="grid-column:span 3">✅ 確定</button>`;
}
document.querySelectorAll('[data-len]').forEach(b=>b.addEventListener('click',()=>{
  SFX.tap();document.querySelectorAll('[data-len]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.total=+b.dataset.len;
}));
$('startBtn').addEventListener('click',()=>{
  if(S.players.length<2) return;
  SFX.tap();
  S.round=0; S.scores=S.players.map(()=>0);
  newRound();
});

function newRound(){
  S.prob = genProblem(S.round, S.total);
  S.turn = 0; S.results = [];
  showPass();
}
function showPass(){
  const p=S.players[S.turn];
  $('passName').innerHTML = `換 ${p.emoji} <b style="color:var(--wire)">${p.name}</b>`;
  $('passDots').innerHTML = S.players.map((_,i)=>
    `<i class="${i<S.turn?'done':(i===S.turn?'now':'')}"></i>`).join('');
  show('pass');
}
$('passBtn').addEventListener('click',()=>{ SFX.tap(); startCalc(); });

function startCalc(){
  S.curInput='';
  $('probTxt').textContent = S.prob.text;
  $('answerShow').innerHTML = '&nbsp;';
  show('calc');
  S.startAt = performance.now();
  bindPad();
}
function bindPad(){
  document.querySelectorAll('#pad [data-k]').forEach(b=>{
    b.onclick = () => {
      SFX.key();
      if(b.dataset.k==='⌫'){ S.curInput = S.curInput.slice(0,-1); }
      else if(S.curInput.length < CONFIG.MAX_ANSWER_LEN + (S.curInput[0]==='−'?1:0)){
        S.curInput += b.dataset.k;
      }
      $('answerShow').textContent = S.curInput || '\u00A0';
    };
  });
  $('okBtn').onclick = () => {
    if(S.curInput==='' || S.curInput==='−') return;
    SFX.tap();
    const timeMs = performance.now()-S.startAt;
    const val = parseInt(S.curInput,10);
    S.results.push({ p:S.players[S.turn], val, correct: val===S.prob.ans, timeMs });
    S.turn++;
    if(S.turn<S.players.length) showPass();
    else doReveal();
  };
}

function doReveal(){
  const ranked = S.results.slice().sort((a,b)=>{
    if(a.correct!==b.correct) return a.correct? -1:1;
    return a.timeMs-b.timeMs;
  });
  const fastestCorrect = ranked.find(r=>r.correct);
  ranked.forEach((r,i)=>{
    const idx = S.players.indexOf(r.p);
    if(r.correct && r===fastestCorrect) S.scores[idx]+=3;
    else if(r.correct) S.scores[idx]+=1;
  });

  $('revTitle').textContent = `第 ${S.round+1} / ${S.total} 題`;
  $('revProb').textContent = `${S.prob.text} = ${S.prob.ans}`;
  $('revBoard').innerHTML = ranked.map((r,i)=>{
    const cls = !r.correct ? 'miss' : (r===fastestCorrect ? 'win' : 'hit');
    const tag = !r.correct ? `答錯了（填 ${r.val}）` : (r===fastestCorrect ? '⚡最快答對！+3' : '答對 +1');
    return `<div class="revRow ${cls}">
      <div class="rk">${i+1}</div>
      <div class="nm">${r.p.emoji} ${r.p.name}<br><span style="font-size:12px;color:var(--dim)">${tag}</span></div>
      <div class="tm">${(r.timeMs/1000).toFixed(1)}s</div>
    </div>`;
  }).join('');
  if(fastestCorrect) SFX.win(); else SFX.miss();
  $('nextBtn').textContent = (S.round+1>=S.total) ? '看最後成績 🏆' : `下一題 →`;
  show('reveal');
}

$('nextBtn').addEventListener('click',()=>{
  SFX.tap();
  S.round++;
  if(S.round>=S.total) return finish();
  newRound();
});

function finish(){
  SFX.champ();
  const rows = S.players.map((p,i)=>({p, sc:S.scores[i]})).sort((a,b)=>b.sc-a.sc);
  const best = rows[0].sc;
  $('overTitle').innerHTML = `${rows[0].p.emoji} <b>${rows[0].p.name}</b> 心算之王！`;
  $('board').innerHTML = rows.map((r,i)=>`
    <div class="row ${r.sc===best?'top':''}">
      <div class="rk">${['🥇','🥈','🥉'][i]||(i+1)}</div>
      <div class="nm">${r.p.emoji} ${r.p.name}</div>
      <div class="sc">${r.sc} 分</div>
    </div>`).join('');
  show('over');
}
$('again').addEventListener('click',()=>{
  SFX.tap();
  S.round=0; S.scores=S.players.map(()=>0);
  newRound();
});

boot();
</script>
</body>
</html>
