<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>素材工廠</title>
<style>
/* 版面概念：手機單欄；上面設定風格，中間貼清單批次出圖，下面是素材庫和匯出 */
:root{
  --bg:#f6f3ee;--fg:#1d1a16;--muted:#7a7066;--panel:#ffffff;--line:#e2dcd3;
  --accent:#b5432b;--accent-fg:#ffffff;--tile:#e9e3da;--ok:#2f7a4a;
  --font:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171412;--fg:#efe9e1;--muted:#a79d92;--panel:#211d1a;--line:#36302a;--accent:#e0664b;--accent-fg:#1a0f0b;--tile:#2a2521;--ok:#6cc08a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#171412;--fg:#efe9e1;--muted:#a79d92;--panel:#211d1a;--line:#36302a;--accent:#e0664b;--accent-fg:#1a0f0b;--tile:#2a2521;--ok:#6cc08a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
body{padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0}
h1 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
section h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 11px;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
textarea{min-height:7em;font:13px/1.5 var(--mono)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.main{flex:1;min-width:0;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;font-size:16px}
button.sec{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
button:disabled{opacity:.45}
.status{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:1.4em}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}
.item .thumb{width:84px;aspect-ratio:1;background:var(--tile);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;position:relative}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .meta{min-width:0}
.item .name{font-weight:600}
.item .seed{font:11px var(--mono);color:var(--muted)}
.item .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.item .acts button{padding:5px 9px;font-size:12px}
.item.kept{border-color:var(--ok)}
.item.kept .name::after{content:" ✓";color:var(--ok)}
.item .acts a{font-size:12px;color:var(--fg)}
pre{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 8px;max-height:6em;overflow:auto}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lib .cell{aspect-ratio:1;background:var(--tile);border-radius:8px;overflow:hidden;position:relative}
.lib .cell img{width:100%;height:100%;object-fit:cover}
.lib .cell span{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .cell b{position:absolute;right:3px;top:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px;font-weight:400}
@media (prefers-reduced-motion:no-preference){.thumb.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:sh 1.4s infinite}@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<h1>素材工廠 <small>自用生圖 → 塞進遊戲</small></h1>
<p class="sub">選類型 → 貼清單 → 批次出圖 → 留下要的 → 匯出素材包</p>

<!-- ① 風格鎖：整批共用，圖才會一致 -->
<section>
  <h2>1 素材類型與風格（整批共用）</h2>
  <div class="chips" id="kinds"></div>
  <div class="row" style="margin-top:8px"><label for="style">風格</label><select id="style"></select></div>
  <div class="row"><label for="extra">補充字</label><input type="text" id="extra" placeholder="選填，例：pastel colors, for kids"></div>
  <div class="row"><label for="family">seed 家族</label><input type="number" id="family" min="0" max="999999"></div>
  <pre id="preview"></pre>
</section>

<!-- ② 清單 -->
<section>
  <h2>2 素材清單（一行一張）</h2>
  <textarea id="list" placeholder="名稱|英文描述&#10;蘋果|red apple&#10;香蕉|yellow banana&#10;只寫名稱也可以，但英文描述出圖比較準"></textarea>
  <div class="btns" style="margin-top:8px">
    <button class="main" id="go">批次出圖</button>
    <button class="sec" id="stop" disabled>停</button>
  </div>
  <p class="status" id="status"></p>
  <p class="note">免費版每 15 秒 1 張；10 張約 2.5 分鐘。畫到一半可以先去做別的事。</p>
</section>

<!-- ③ 這批結果 -->
<section>
  <h2>3 這批結果（✓ 留的會進素材庫）</h2>
  <div class="list" id="results"></div>
</section>

<!-- ④ 素材庫與匯出 -->
<section>
  <h2>4 素材庫 <span id="libcount"></span></h2>
  <div class="lib" id="lib"></div>
  <div class="btns" style="margin-top:8px">
    <button class="main" id="export">下載素材包 .json</button>
    <button class="sec" id="clear">清空素材庫</button>
  </div>
  <p class="note">素材包傳給 Claude 就能直接塞進遊戲。圖存在這支手機的瀏覽器裡，換裝置不會帶著走，所以要的先下載。</p>
</section>

<!-- ===== 第一段：純邏輯（不碰畫面），方便無頭驗證 ===== -->
<script id="core">
// 常數全部集中：換大腦、改節奏、改尺寸，只動這一塊
const CONFIG = {
  api: 'https://image.pollinations.ai/prompt/', // 免費生圖網址（匿名、免金鑰）
  model: 'flux',          // 借用的大腦
  gapMs: 15000,           // 免費版節奏：兩張之間至少隔 15 秒
  timeoutMs: 90000,       // 一張最多等 90 秒
  tries: 3,               // 一張最多試幾次（每次之間照 gapMs 等）
  maxPx: 768,             // 存進素材庫時最長邊縮到幾像素（控制檔案大小）
  jpegQ: 0.82,            // JPEG 壓縮品質
  storeKey: 'assetfactory.v2', // localStorage 抽屜名（設定用）
  dbName: 'assetfactory', // IndexedDB 名稱（存圖用）
};

// 素材類型：尺寸＋自動補的風格字；玩家只要選類型，不用懂
const KINDS = [
  { id:'card',   name:'卡面',  w:768,  h:768,  words:'single centered subject, game card illustration, clean flat color background, no text' },
  { id:'icon',   name:'圖示',  w:512,  h:512,  words:'simple bold icon, flat design, thick outline, plain background, no text' },
  { id:'bg',     name:'背景',  w:1024, h:576,  words:'game background scene, wide view, no characters, no text' },
  { id:'puzzle', name:'拼圖',  w:1024, h:768,  words:'richly detailed scene, many distinct objects, vivid colors, no text' },
  { id:'char',   name:'人物',  w:768,  h:1024, words:'single character, full body, standing, plain background, no text' },
  // 去背用：畫在純綠底上，塞進遊戲時用程式把綠色摳掉（Flux 畫不出透明背景）
  { id:'cutout', name:'角色・去背', w:768, h:1024, words:'single character, full body, standing, facing slightly left, centered, isolated on a flat solid bright green background, no shadow on the ground, no text' },
];

// 風格：整批共用一組，圖才會像同一套
const STYLES = [
  ['兒童繪本',   'children picture book illustration, soft watercolor, friendly, warm'],
  ['卡通貼紙',   'cute cartoon sticker style, bold outlines, bright colors'],
  ['像素風',     '16-bit pixel art style, limited palette'],
  ['寫實照片',   'photorealistic, soft natural light'],
  ['剪紙',       'paper cut-out craft style, layered paper, soft shadows'],
  ['水墨',       'ink wash painting style, minimal, elegant'],
  ['魔法學院',   'magic academy fantasy illustration, wizard robes, candlelight, old castle, rich warm colors, bold clean outlines, game art'],
];

// 把清單文字拆成 [{name, desc}]；「名稱|描述」或只有名稱
function parseList(text){
  return (text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const i = l.indexOf('|');
    return i<0 ? {name:l, desc:l} : {name:l.slice(0,i).trim(), desc:l.slice(i+1).trim() || l.slice(0,i).trim()};
  });
}

// 拼提示詞：描述 → 類型字 → 風格字 → 補充字
function buildPrompt(desc, kind, styleIdx, extra){
  return [desc, kind.words, STYLES[styleIdx][1], (extra||'').trim()].filter(Boolean).join(', ');
}

// 第 i 張的 seed：家族號＋編號；重抽加 1000，所以同一張永遠能重現
function seedFor(family, i, redraw){ return (family + i + (redraw||0)*1000) % 1000000; }

// 組網址
function imageUrl(prompt, w, h, seed){
  return CONFIG.api + encodeURIComponent(prompt) + '?width='+w+'&height='+h+'&seed='+seed+'&model='+CONFIG.model+'&nologo=true';
}

function randSeed(){ return Math.floor(Math.random()*1e6); }
</script>

<!-- ===== 第二段：畫面、批次、素材庫 ===== -->
<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// --- 設定存 localStorage（包 try，壞了不當機） ---
function loadCfg(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storeKey))||{}; }catch(e){ return {}; } }
function saveCfg(c){ try{ localStorage.setItem(CONFIG.storeKey, JSON.stringify(c)); }catch(e){} }
let cfg = loadCfg();

// --- 素材庫存 IndexedDB（localStorage 只有 5MB，裝不下圖） ---
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(CONFIG.dbName, 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('assets',{keyPath:'id'});   // 第一次開：建一個抽屜叫 assets
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
async function dbAll(){ try{ const db=await openDB(); return await new Promise((res,rej)=>{ const q=db.transaction('assets').objectStore('assets').getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return []; } }
async function dbPut(a){ try{ const db=await openDB(); await new Promise((res,rej)=>{ const t=db.transaction('assets','readwrite'); t.objectStore('assets').put(a); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }
async function dbDel(id){ try{ const db=await openDB(); await new Promise((res,rej)=>{ const t=db.transaction('assets','readwrite'); t.objectStore('assets').delete(id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }
async function dbClear(){ try{ const db=await openDB(); await new Promise((res,rej)=>{ const t=db.transaction('assets','readwrite'); t.objectStore('assets').clear(); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} }

// --- 把下拉和 chips 填好 ---
$('kinds').innerHTML = KINDS.map((k,i)=>'<button class="chip" type="button" data-i="'+i+'">'+k.name+' '+k.w+'×'+k.h+'</button>').join('');
$('style').innerHTML = STYLES.map((s,i)=>'<option value="'+i+'">'+s[0]+'</option>').join('');
let kindIdx = 0;
function setKind(i){ kindIdx=i; [...$('kinds').children].forEach((b,k)=>b.classList.toggle('on',k===i)); refresh(); }
$('kinds').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) setKind(+b.dataset.i); });

// --- 讀寫表單 ---
function readForm(){ return { kind:kindIdx, style:+$('style').value, extra:$('extra').value, family:+$('family').value||0, list:$('list').value }; }
function refresh(){
  const f = readForm();
  const first = parseList(f.list)[0];
  $('preview').textContent = '範例提示詞：' + buildPrompt(first?first.desc:'(清單第一行)', KINDS[f.kind], f.style, f.extra);
  saveCfg(f);
}
for (const id of ['style','extra','family','list']) $(id).addEventListener('input', refresh);

// --- 載圖：先用 fetch 拿圖（拿得到就能存 base64）；對方不給跨網域就退回普通 <img>（看得到但存不了） ---
let corsOK = null;                       // null＝還不知道；true＝能存；false＝對方不給，之後不再浪費請求
function plainImg(url){
  return new Promise(res=>{
    const img = new Image();
    const timer = setTimeout(()=>{ img.src=''; res(null); }, CONFIG.timeoutMs);
    img.onload = ()=>{ clearTimeout(timer); res(img); };
    img.onerror = ()=>{ clearTimeout(timer); res(null); };
    img.src = url;
  });
}
async function loadImage(url){
  if (corsOK === false) return plainImg(url);                          // 已知對方不給跨網域：直接普通載入
  try{
    const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), CONFIG.timeoutMs);
    const r = await fetch(url, {signal: ctl.signal}); clearTimeout(timer);
    if (!r.ok) return null;                                            // 429／500＝對方忙：回 null 讓外面等一下再試，不要馬上再要一次
    const b = await r.blob(); if (!b.type.startsWith('image/')) return null;
    const img = await plainImg(URL.createObjectURL(b));               // 自己家的 blob 網址，畫到 canvas 不會被鎖
    if (img) corsOK = true;
    return img;
  }catch(e){
    if (e && e.name==='TypeError'){                                    // TypeError＝被跨網域擋下：以後直接走普通載入
      if (corsOK===null) $('status').textContent='對方不給跨網域，圖看得到但素材庫只能記網址；要的圖請「開大圖」長按存相簿';
      corsOK = false; return plainImg(url);
    }
    return null;                                                       // 逾時或其他錯：當失敗，外面會重試
  }
}
// 圖 → 縮小 → JPEG base64（存素材庫用）；對方不給跨網域許可就回 null
function toDataUrl(img){
  try{
    const s = Math.min(1, CONFIG.maxPx / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', CONFIG.jpegQ);
  }catch(e){ return null; }
}

// --- 批次出圖 ---
let runId = 0, items = [], lastDone = 0;     // items：這批每一張的狀態；lastDone：上一次請求結束的時間
function renderItem(it){
  const el = it.el;
  el.className = 'item' + (it.kept?' kept':'');
  el.innerHTML =
    '<div class="thumb'+(it.state==='loading'?' loading':'')+'">'+(it.img?'':(it.state==='loading'?'畫圖中…':it.state==='fail'?'沒出來':'排隊'))+'</div>'+
    '<div class="meta"><div class="name"></div><div class="seed">seed '+it.seed+' · '+it.w+'×'+it.h+'</div>'+
    '<div class="acts">'+
      '<button class="sec" data-a="keep" '+(it.img?'':'disabled')+'>'+(it.kept?'已留':'✓ 留')+'</button>'+
      '<button class="sec" data-a="redraw" '+(it.state==='loading'?'disabled':'')+'>🔁 重抽</button>'+
      (it.url?'<a href="'+it.url+'" target="_blank" rel="noopener">開大圖</a>':'')+
    '</div></div>';
  el.querySelector('.name').textContent = it.name;
  if (it.img) el.querySelector('.thumb').appendChild(it.img);
}
$('results').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  const it = items[+b.closest('.item').dataset.i];
  if (b.dataset.a==='keep' && it.img && !it.kept){ await keep(it); renderItem(it); }
  if (b.dataset.a==='redraw'){ it.redraw=(it.redraw||0)+1; runQueue([it]); }     // 重抽：換 seed，只跑這一張
});
async function keep(it){
  const data = it.dataUrl || toDataUrl(it.img);                      // 轉 base64；失敗就只存網址
  it.kept = true;
  await dbPut({ id:it.id, name:it.name, prompt:it.prompt, seed:it.seed, w:it.w, h:it.h, url:it.url, data:data, kind:KINDS[kindIdx].id, t:Date.now() });
  if (!data) $('status').textContent = '這張存不成圖檔（對方不給跨網域），只記了網址；請「開大圖」長按存相簿';
  renderLib();
}

// 依序出圖，兩張之間至少隔 gapMs；傳入哪些 items 就跑哪些
async function runQueue(queue){
  const my = ++runId;
  $('go').disabled = true; $('stop').disabled = false;
  // 節奏：每次「送出請求」之間至少隔 gapMs，從上一次請求「結束」（不管成功失敗）起算
  async function pace(label){
    const wait = CONFIG.gapMs - (Date.now() - lastDone);
    for (let left=wait; left>0 && my===runId; left-=1000){ $('status').textContent=label+' '+Math.ceil(left/1000)+' 秒後開始'; await sleep(1000); }
  }
  for (let n=0;n<queue.length;n++){
    if (my!==runId) break;
    const it = queue[n];
    it.seed = seedFor(it.family, it.index, it.redraw);
    it.url = imageUrl(it.prompt, it.w, it.h, it.seed);
    it.img = null; it.dataUrl = null; it.kept = false; it.state='loading'; renderItem(it);
    let img = null;
    for (let tryN=1; tryN<=CONFIG.tries && !img && my===runId; tryN++){
      await pace(tryN===1 ? '第 '+(n+1)+' 張（'+it.name+'）' : it.name+' 沒出來，第 '+tryN+' 次重試');
      if (my!==runId) break;
      $('status').textContent = it.name+' 畫圖中…';
      img = await loadImage(it.url);
      lastDone = Date.now();                                          // 這次請求結束，節奏從這裡重算
    }
    if (my!==runId) break;
    if (img){ it.img=img; it.state='ok'; it.dataUrl=toDataUrl(img); } else { it.state='fail'; }
    renderItem(it);
  }
  if (my===runId){ $('status').textContent='這批跑完。按 ✓ 留下要的，不要的按重抽'; $('go').disabled=false; $('stop').disabled=true; }
}
$('go').addEventListener('click', ()=>{
  const f = readForm(); const rows = parseList(f.list);
  if (!rows.length){ $('status').textContent='清單是空的，一行寫一張'; return; }
  if (!f.family){ $('family').value=randSeed(); refresh(); }
  const fam = +$('family').value, kind = KINDS[f.kind];
  $('results').innerHTML=''; items = rows.map((r,i)=>{
    const el=document.createElement('div'); el.className='item'; el.dataset.i=i; $('results').appendChild(el);
    return { el, id:Date.now()+'-'+i, index:i, name:r.name, prompt:buildPrompt(r.desc,kind,f.style,f.extra), w:kind.w, h:kind.h, family:fam, redraw:0, state:'queue' };
  });
  items.forEach(renderItem);
  runQueue(items);
});
$('stop').addEventListener('click', ()=>{ runId++; $('go').disabled=false; $('stop').disabled=true; $('status').textContent='停了'; });

// --- 素材庫 ---
async function renderLib(){
  const all = (await dbAll()).sort((a,b)=>b.t-a.t);
  $('libcount').textContent = all.length ? '（'+all.length+' 張）' : '';
  $('lib').innerHTML = all.map(a=>'<div class="cell" data-id="'+a.id+'">'+(a.data?'<img src="'+a.data+'" alt="">':'')+'<span></span><b data-del="'+a.id+'">✕</b></div>').join('');
  [...$('lib').children].forEach((c,i)=>c.querySelector('span').textContent=all[i].name);
}
$('lib').addEventListener('click', async e=>{ const d=e.target.closest('[data-del]'); if(d){ await dbDel(d.dataset.del); renderLib(); } });
$('clear').addEventListener('click', async ()=>{ if ($('clear').textContent!=='真的清空？'){ $('clear').textContent='真的清空？'; setTimeout(()=>$('clear').textContent='清空素材庫',3000); return; } await dbClear(); $('clear').textContent='清空素材庫'; renderLib(); });

// 匯出素材包：一個 JSON，裡面每張圖都是 base64，Claude 收到直接塞進遊戲
$('export').addEventListener('click', async ()=>{
  const all = await dbAll();
  if (!all.length){ $('status').textContent='素材庫是空的'; return; }
  const pack = { app:'素材工廠', version:2, exported:new Date().toISOString(), count:all.length,
    items: all.map(a=>({ name:a.name, kind:a.kind, prompt:a.prompt, seed:a.seed, w:a.w, h:a.h, url:a.url, data:a.data })) };
  const blob = new Blob([JSON.stringify(pack)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='assets-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  $('status').textContent='素材包 '+Math.round(blob.size/1024)+' KB，存到「檔案」後傳給 Claude';
});

// --- 任務連結：網址帶 ?job=（base64 的 JSON）就自動填好、自動開跑；Claude 寫好清單丟連結，Kris 只要點 ---
// JSON 長這樣：{"kind":"cutout","style":6,"extra":"","family":800579,"list":"戰士|...\n法師|...","auto":1}
function readJob(){
  try{
    const q = new URLSearchParams(location.search).get('job'); if (!q) return null;
    const bin = atob(q.replace(/-/g,'+').replace(/_/g,'/'));                         // base64url → base64 → 位元組
    const json = new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0)));  // 位元組 → UTF-8 文字（中文才不會爛）
    return JSON.parse(json);
  }catch(e){ return null; }
}

// --- 開場：有任務連結照任務；沒有就帶回上次設定 ---
const job = readJob();
if (job){
  const ki = Math.max(0, KINDS.findIndex(k=>k.id===job.kind));
  setKind(ki);
  $('style').value = job.style||0; $('extra').value = job.extra||''; $('family').value = job.family||randSeed();
  $('list').value = job.list||'';
  refresh(); renderLib();
  if (job.auto){ $('status').textContent='任務連結：自動開跑'; $('go').click(); }
} else {
  setKind(cfg.kind||0);
  $('style').value = cfg.style||0; $('extra').value = cfg.extra||''; $('family').value = cfg.family||randSeed();
  $('list').value = cfg.list || '蘋果|red apple\n香蕉|yellow banana\n葡萄|bunch of purple grapes\n西瓜|slice of watermelon';
  refresh(); renderLib();
}
</script>
