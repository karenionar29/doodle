<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>迷你 MJ</title>
<style>
/* 版面概念：手機單欄；上面是「七層點餐單」，中間是提示詞預覽，下面是 2×2 出圖格 */
:root{
  --bg:#f6f3ee;        /* 米白底，像相紙 */
  --fg:#1d1a16;        /* 深咖啡字 */
  --muted:#7a7066;     /* 說明文字 */
  --panel:#ffffff;     /* 卡片底 */
  --line:#e2dcd3;      /* 細線 */
  --accent:#b5432b;    /* 鏽紅，呼應那張紅客廳 */
  --accent-fg:#ffffff;
  --tile:#e9e3da;      /* 空的出圖格 */
  --font:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171412;--fg:#efe9e1;--muted:#a79d92;--panel:#211d1a;--line:#36302a;
    --accent:#e0664b;--accent-fg:#1a0f0b;--tile:#2a2521;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171412;--fg:#efe9e1;--muted:#a79d92;--panel:#211d1a;--line:#36302a;
  --accent:#e0664b;--accent-fg:#1a0f0b;--tile:#2a2521;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
body{padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:.02em}
h1 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
section h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on,.chip:active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13px;color:var(--muted)}
input[type=text],select{width:100%;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input[type=range]{width:100%}
.ratio{display:flex;gap:6px}
.ratio button{flex:1;padding:7px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.ratio button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
pre{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 8px;max-height:9em;overflow:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.main{flex:1;min-width:0;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;font-size:16px}
button.sec{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
button:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;background:var(--tile);border-radius:10px;overflow:hidden;aspect-ratio:var(--ar,1);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:8px;border:2px solid transparent}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.sel{border-color:var(--accent)}
.tile .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.status{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:1.4em}
.fav{display:flex;gap:6px;flex-wrap:wrap}
.fav .chip{display:flex;gap:6px;align-items:center}
.fav .chip b{font-weight:400;opacity:.6}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.tile.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:sh 1.4s infinite}@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<h1>迷你 MJ <small>仿 Midjourney 工作流 · 大腦借 Flux</small></h1>
<p class="sub">七層點餐 → 一次 4 張 → 挑一張 → 再抽／放大／存喜歡</p>

<!-- ① 範例與喜歡：讓頁面一打開就有東西可按 -->
<section>
  <h2>範例・我的喜歡</h2>
  <div class="chips" id="presets"></div>
  <div class="fav" id="favs" style="margin-top:6px"></div>
</section>

<!-- ② 七層點餐單 -->
<section>
  <h2>七層點餐單</h2>
  <div class="row"><label for="subject">1 主體</label><input type="text" id="subject" placeholder="例：oversized red velvet sofa（中文也可）"></div>
  <div class="row"><label for="scene">2 場景</label><input type="text" id="scene" placeholder="例：monochrome terracotta living room"></div>
  <div class="row"><label for="light">3 光線</label><select id="light"></select></div>
  <div class="row"><label for="material">4 材質</label><select id="material"></select></div>
  <div class="row"><label for="camera">5 相機</label><select id="camera"></select></div>
  <div class="row"><label for="style">6 風格</label><select id="style"></select></div>
  <div class="row"><label>7 長寬比</label><div class="ratio" id="ratio"></div></div>
  <div class="row"><label for="stylize">　MJ 味</label><input type="range" id="stylize" min="0" max="2" step="1" value="1"></div>
</section>

<!-- ③ 提示詞預覽 -->
<section>
  <h2>拼好的提示詞</h2>
  <pre id="prompt"></pre>
  <div class="btns">
    <button class="main" id="go">生成 4 張</button>
    <button class="sec" id="copy">複製提示詞</button>
  </div>
  <p class="status" id="status"></p>
</section>

<!-- ④ 出圖格 -->
<section>
  <h2>四張選一張</h2>
  <div class="grid" id="grid"></div>
  <div class="btns" style="margin-top:8px">
    <button class="sec" id="vary" disabled>🔁 再抽 4 張</button>
    <button class="sec" id="hd" disabled>🔍 放大 HD</button>
    <button class="sec" id="like" disabled>❤️ 存喜歡</button>
    <a class="sec" id="open" style="display:none;text-decoration:none;line-height:1.3" target="_blank" rel="noopener">⬇️ 開大圖</a>
  </div>
  <p class="note">免費版每 15 秒只能出 1 張，所以 4 張要等約 1 分鐘。圖是 Flux 畫的，不是 Midjourney 本人。</p>
</section>

<!-- ===== 第一段：純邏輯（沒有碰畫面），方便無頭驗證 ===== -->
<script id="core">
// 常數全部集中在這裡：換大腦、改節奏，只動這一塊
const CONFIG = {
  api: 'https://image.pollinations.ai/prompt/', // 免費生圖網址（匿名、免金鑰）
  model: 'flux',          // 借用的大腦
  gapMs: 15000,           // 免費版節奏：兩張之間至少隔 15 秒
  timeoutMs: 90000,       // 一張最多等 90 秒
  hdScale: 1.5,           // 放大倍率
  storeKey: 'minimj.v1',  // localStorage 的抽屜名
  ratios: { '1:1':[1024,1024], '3:4':[768,1024], '4:3':[1024,768], '16:9':[1280,720] },
};

// 下拉選單的選項：左邊是玩家看到的中文，右邊是塞進提示詞的英文
const OPTIONS = {
  light: [
    ['柔和散射光','soft indirect diffused light'],
    ['黃金時刻斜光','golden hour sunlight raking across surfaces, long shadows'],
    ['陰天冷調','overcast soft light, cool and moody'],
    ['乾淨棚拍','clean studio lighting'],
    ['夜晚霓虹','neon night lights, wet reflections'],
  ],
  material: [
    ['絨布＋灰泥','velvet and plaster textures'],
    ['粗石＋水面','rough travertine stone and still water'],
    ['鋼＋瓷磚','brushed steel and glossy tiles'],
    ['木頭＋亞麻','warm wood and linen'],
    ['火山岩＋野花','dark lava rock and small white wildflowers'],
  ],
  camera: [
    ['平視廣角','eye-level wide shot'],
    ['低角度仰拍','low angle shot'],
    ['超廣角風景','ultra wide landscape shot'],
    ['長曝光動態','long exposure, motion blur on people'],
    ['特寫','close-up, shallow depth of field'],
  ],
  style: [
    ['建築雜誌風','architectural interior photography, minimalist, tonal color palette, editorial style'],
    ['極簡紀念碑','brutalist minimalism, monumental scale, tiny human figures for scale'],
    ['陰鬱風景','moody landscape photography, mist, cinematic atmosphere'],
    ['黑白紀實','black and white documentary photography, high contrast'],
    ['溫暖電影感','warm cinematic photography, film grain, soft color grading'],
  ],
};

// 「MJ 味」三段：0 寫實少調味、1 雜誌感、2 滿滿 MJ 式華麗
const SEASONING = [
  'photorealistic',
  'editorial photography, refined composition',
  'award-winning editorial photography, rich color grading, exquisite composition, highly detailed',
];

// 四張截圖逆向出來的範例（七層設定）
const PRESETS = [
  { name:'紅絨客廳', subject:'oversized rust-red velvet modular sofa, large abstract painting on the wall, cream wool rug, translucent red acrylic coffee table', scene:'monochrome terracotta living room with a potted plant in the background', light:0, material:0, camera:0, style:0, ratio:'4:3', stylize:1 },
  { name:'石牆倒影', subject:'monumental travertine stone walls rising from a still reflecting pool', scene:'tiny human figures walking between the walls', light:1, material:1, camera:0, style:1, ratio:'3:4', stylize:1 },
  { name:'圓環山景', subject:'a giant thin black metal ring sculpture framing a mist-covered mountain', scene:'volcanic highland with a dark lava field and small white flowers', light:2, material:4, camera:2, style:2, ratio:'3:4', stylize:2 },
  { name:'黑白地鐵', subject:'blurred commuters walking through a modern subway corridor', scene:'curved white tiled ceiling, steel handrails in sharp focus', light:3, material:2, camera:3, style:3, ratio:'3:4', stylize:0 },
];

// 把七層拼成一段英文提示詞
function buildPrompt(L){
  const parts = [
    (L.subject||'').trim(),
    (L.scene||'').trim(),
    OPTIONS.light[L.light][1],
    OPTIONS.material[L.material][1],
    OPTIONS.camera[L.camera][1],
    OPTIONS.style[L.style][1],
    SEASONING[L.stylize],
  ].filter(Boolean);                       // 空的就跳過
  return parts.join(', ');
}

// 長寬比 → 寬高像素；放大就乘倍率
function sizeFor(ratio, scale){
  const [w,h] = CONFIG.ratios[ratio] || CONFIG.ratios['1:1'];
  const s = scale || 1;
  return [Math.round(w*s), Math.round(h*s)];
}

// 組出一張圖的網址：同一個 seed ＋ 同一段提示詞 → 同一張圖
function imageUrl(prompt, ratio, seed, scale){
  const [w,h] = sizeFor(ratio, scale);
  return CONFIG.api + encodeURIComponent(prompt)
    + '?width=' + w + '&height=' + h + '&seed=' + seed
    + '&model=' + CONFIG.model + '&nologo=true';
}

// 隨機 seed（0～999999）
function randSeed(){ return Math.floor(Math.random()*1e6); }
</script>

<!-- ===== 第二段：畫面與操作 ===== -->
<script>
const $ = id => document.getElementById(id);

// --- 存檔：localStorage 讀寫都包 try，私密模式壞了也不當機 ---
function loadStore(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storeKey)) || {}; }catch(e){ return {}; } }
function saveStore(s){ try{ localStorage.setItem(CONFIG.storeKey, JSON.stringify(s)); }catch(e){} }
let store = loadStore();          // { last:{七層}, favs:[{name,七層}] }
store.favs = store.favs || [];

// --- 把下拉選單填好 ---
for (const key of ['light','material','camera','style']){
  $(key).innerHTML = OPTIONS[key].map((o,i)=>'<option value="'+i+'">'+o[0]+'</option>').join('');
}
// 長寬比按鈕
$('ratio').innerHTML = Object.keys(CONFIG.ratios).map(r=>'<button type="button" data-r="'+r+'">'+r+'</button>').join('');
$('ratio').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; setRatio(b.dataset.r); refresh(); });
function setRatio(r){ for (const b of $('ratio').children) b.classList.toggle('on', b.dataset.r===r); }
function getRatio(){ const b=[...$('ratio').children].find(b=>b.classList.contains('on')); return b ? b.dataset.r : '1:1'; }

// --- 七層 ⇄ 表單 ---
function readLayers(){
  return { subject:$('subject').value, scene:$('scene').value,
    light:+$('light').value, material:+$('material').value, camera:+$('camera').value, style:+$('style').value,
    ratio:getRatio(), stylize:+$('stylize').value };
}
function writeLayers(L){
  $('subject').value=L.subject||''; $('scene').value=L.scene||'';
  $('light').value=L.light||0; $('material').value=L.material||0; $('camera').value=L.camera||0; $('style').value=L.style||0;
  setRatio(L.ratio||'1:1'); $('stylize').value=L.stylize==null?1:L.stylize;
  refresh();
}

// --- 範例與喜歡的 chips ---
$('presets').innerHTML = PRESETS.map((p,i)=>'<button class="chip" type="button" data-i="'+i+'">'+p.name+'</button>').join('');
$('presets').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; writeLayers(PRESETS[+b.dataset.i]); });
function renderFavs(){
  $('favs').innerHTML = store.favs.map((f,i)=>'<button class="chip" type="button" data-i="'+i+'">❤️ '+f.name+'<b data-del="'+i+'">✕</b></button>').join('');
}
$('favs').addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if (del){ store.favs.splice(+del.dataset.del,1); saveStore(store); renderFavs(); return; }  // 按 ✕ 刪掉
  const b = e.target.closest('button'); if(!b) return;
  writeLayers(store.favs[+b.dataset.i]);                                                     // 按名字 → 帶回表單
});
renderFavs();

// --- 提示詞預覽：表單一動就重拼，也順手存成「上次」 ---
function refresh(){
  const L = readLayers();
  $('prompt').textContent = buildPrompt(L);
  document.documentElement.style.setProperty('--ar', L.ratio.replace(':','/'));   // 出圖格跟著長寬比變形
  store.last = L; saveStore(store);
}
for (const id of ['subject','scene','light','material','camera','style','stylize']) $(id).addEventListener('input', refresh);

// --- 複製提示詞 ---
$('copy').addEventListener('click', ()=>{
  const t = $('prompt').textContent;
  const done = ()=>{ $('status').textContent='已複製，可以貼去真的 Midjourney 用'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>fallback());
  else fallback();
  function fallback(){ const r=document.createRange(); r.selectNodeContents($('prompt')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('status').textContent='已選取，長按複製'; }
});

// --- 出圖格 ---
const tiles = [];                    // 四格的狀態：{el, img, seed, url, prompt, ratio}
let selected = -1;                   // 目前選中哪一格
let runId = 0;                       // 每次生成一個流水號，舊的排隊會自動停

$('grid').innerHTML = '';
for (let i=0;i<4;i++){
  const el = document.createElement('div'); el.className='tile'; el.textContent='按「生成 4 張」';
  el.addEventListener('click', ()=>select(i));
  $('grid').appendChild(el);
  tiles.push({el, img:null, seed:null, url:null, prompt:null, ratio:null});
}

function select(i){
  if (!tiles[i].url) return;                                   // 還沒有圖不能選
  selected = i;
  tiles.forEach((t,k)=>t.el.classList.toggle('sel', k===i));
  $('vary').disabled = $('hd').disabled = $('like').disabled = false;
  $('open').href = tiles[i].url; $('open').style.display='';
}

// 載入一張圖：回傳 Promise，成功或失敗都會結束
function loadImage(url){
  return new Promise(res=>{
    const img = new Image();
    const timer = setTimeout(()=>{ img.src=''; res({ok:false, img}); }, CONFIG.timeoutMs);
    img.onload = ()=>{ clearTimeout(timer); res({ok:true, img}); };
    img.onerror = ()=>{ clearTimeout(timer); res({ok:false, img}); };
    img.src = url;
  });
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// 主流程：依序出圖，兩張之間至少隔 gapMs
async function generate(seeds, scale){
  const myRun = ++runId;
  const L = readLayers();
  const prompt = buildPrompt(L);
  if (!L.subject.trim()){ $('status').textContent='第 1 層「主體」要先寫東西'; return; }
  $('go').disabled = true; selected=-1; $('open').style.display='none';
  $('vary').disabled = $('hd').disabled = $('like').disabled = true;
  tiles.forEach(t=>{ t.el.className='tile'; t.el.textContent='排隊中'; t.url=null; });

  for (let i=0;i<seeds.length;i++){
    if (myRun!==runId) return;                                  // 有新的生成開始了，這批停掉
    const t = tiles[i];
    t.seed = seeds[i]; t.prompt = prompt; t.ratio = L.ratio;
    t.url = imageUrl(prompt, L.ratio, t.seed, scale);
    t.el.className='tile loading'; t.el.textContent='第 '+(i+1)+' 張畫圖中…';
    const started = Date.now();
    let r = await loadImage(t.url);
    if (!r.ok && myRun===runId){                                // 失敗就等一下再試一次
      t.el.textContent='第 '+(i+1)+' 張失敗，20 秒後重試';
      await sleep(20000);
      if (myRun!==runId) return;
      r = await loadImage(t.url);
    }
    if (myRun!==runId) return;
    if (r.ok){
      t.el.className='tile'; t.el.textContent='';
      r.img.alt='第 '+(i+1)+' 張'; t.el.appendChild(r.img);
      const tag=document.createElement('span'); tag.className='tag'; tag.textContent=(scale?'HD ':'')+'#'+(i+1)+' seed '+t.seed; t.el.appendChild(tag);
    } else {
      t.el.className='tile'; t.el.textContent='這張沒出來，等下再抽'; t.url=null;
    }
    // 等到距離這張開始滿 15 秒，才排下一張（免費版的節奏）
    if (i<seeds.length-1){
      const wait = CONFIG.gapMs - (Date.now()-started);
      for (let left=wait; left>0 && myRun===runId; left-=1000){
        $('status').textContent='第 '+(i+2)+' 張 '+Math.ceil(left/1000)+' 秒後開始';
        await sleep(1000);
      }
    }
  }
  if (myRun!==runId) return;
  $('status').textContent='完成。點一張圖，可以再抽、放大或存喜歡';
  $('go').disabled = false;
}

// 生成 4 張：四個隨機 seed
$('go').addEventListener('click', ()=>generate([randSeed(),randSeed(),randSeed(),randSeed()]));
// 再抽 4 張：同提示詞、換 seed（仿 MJ 的 V 按鈕；真 MJ 會以選中那張為基準，這裡做不到）
$('vary').addEventListener('click', ()=>generate([randSeed(),randSeed(),randSeed(),randSeed()]));
// 放大 HD：同 seed、尺寸乘倍率，只出 1 張放第 1 格（仿 MJ 的 U 按鈕）
$('hd').addEventListener('click', ()=>{ if(selected<0) return; generate([tiles[selected].seed], CONFIG.hdScale); });
// 存喜歡：把現在的七層設定記下來，下次一鍵帶回
$('like').addEventListener('click', ()=>{
  const L = readLayers();
  const name = (L.subject.split(',')[0]||'未命名').slice(0,14);
  store.favs.unshift({name, ...L}); store.favs = store.favs.slice(0,12);   // 最多留 12 個
  saveStore(store); renderFavs();
  $('status').textContent='存好了：'+name;
});

// --- 開場：有上次就帶上次，沒有就帶第一個範例 ---
writeLayers(store.last && store.last.subject ? store.last : PRESETS[0]);
</script>
</body>
</html>
